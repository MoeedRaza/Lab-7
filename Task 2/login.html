<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Login | Lootify</title>
</head>

<body>

  <nav class="site-navbar">
    <div class="container nav-shell">
      <a class="navbar-brand" href="index.html"><span class="brand-mark">L</span>LOOT<span
          class="brand-accent">IFY</span></a>
      <div class="nav-links">
        <a class="nav-link " href="index.html">Home</a>
        <a class="nav-link " href="products.html">Marketplace</a>
        <a class="nav-link " href="index.html#reviews">Reviews</a>
        <a class="nav-link " href="cart.html">Cart</a>
        <a class="btn btn-darkline btn-sm ms-md-2" href="login.html">Login</a>
        <a class="btn btn-accent btn-sm ms-1" href="signup.html">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <div class="section-label mb-2">PLAYER ACCOUNT</div>
        <h1>Welcome back.</h1>
        <p class="auth-note mb-4">Login to continue to Lootify.</p>
        <form action="index.html">
          <div class="mb-3"><label class="form-label">Username</label><input class="form-control"
              placeholder="Enter your username" required></div>
          <div class="mb-4"><label class="form-label">Password</label><input type="password" class="form-control"
              placeholder="Enter your password" required></div>
          <button class="btn btn-accent w-100">Login</button>
        </form>
        <div class="text-center mt-4 auth-note">New to Lootify? <a class="auth-link" href="signup.html">Create an
            account</a></div>
      </div>
    </div>
  </main>
</body>

</html>
